name: Build FreeYou APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show project structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== App directory ==="
          ls -la app || true
          echo "=== Gradle wrapper ==="
          ls -la gradlew gradle/wrapper || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --warning-mode all

      - name: Find generated APK
        if: success()
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi

          cp "$APK" out/FreeYou-debug.apk

      - name: Upload FreeYou APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FreeYou-Debug-APK
          path: out/FreeYou-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FreeYou-Build-Reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
