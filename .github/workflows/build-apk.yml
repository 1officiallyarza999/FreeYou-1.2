name: Build FreeYou 1.6.2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Apply FreeYou 1.6.2 stability hotfix
        shell: bash
        run: |
          set -euo pipefail
          PATCH_ZIP="FreeYou-1.6.2-Stability-Hotfix.zip"
          PATCH_ROOT="$RUNNER_TEMP/freeyou_162_patch"

          test -f "$PATCH_ZIP" || { echo "Missing $PATCH_ZIP"; exit 1; }

          rm -rf "$PATCH_ROOT"
          mkdir -p "$PATCH_ROOT"

          unzip -q -o "$PATCH_ZIP" -d "$PATCH_ROOT"

          PATCH_APP="$PATCH_ROOT/FreeYou-1.6.2-Stability-Hotfix/app"

          test -d "$PATCH_APP" || {
            echo "Patch app directory missing"
            exit 1
          }

          cp -a "$PATCH_APP/." app/

          echo "Verifying FreeYou 1.6.2 safety/stability fixes..."

          grep -Fq 'versionName = "1.6.2"' app/build.gradle.kts

          grep -Fiq 'onlyjerk' \
            app/src/main/java/com/freeyou/data/AdultBlockEngine.kt

          grep -Fq 'com.android.systemui' \
            app/src/main/java/com/freeyou/BlockerAccessibilityService.kt

          grep -Fq 'pageAlreadyExited' \
            app/src/main/java/com/freeyou/BlockInterventionCoordinator.kt

          grep -Fq 'AFTER_RETURN_QUIET_WINDOW_MS' \
            app/src/main/java/com/freeyou/BlockInterventionCoordinator.kt

          ! grep -Fq 'onBack = { goHome(context) }' \
            app/src/main/java/com/freeyou/BlockInterventionCoordinator.kt

          grep -Fq 'addDisallowedApplication(packageName)' \
            app/src/main/java/com/freeyou/vpn/ShieldVpnService.kt

          grep -Fq 'Semaphore(16)' \
            app/src/main/java/com/freeyou/vpn/ShieldVpnService.kt

          echo "FreeYou 1.6.2 verification passed."

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew clean :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify APK exists
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload FreeYou 1.6.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeYou-1.6.2-Stability-Hotfix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
